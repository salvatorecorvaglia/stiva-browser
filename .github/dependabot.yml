version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/desktop"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/tests/browser"
      - "/tests/s3-fixture"
    schedule:
      interval: "weekly"
