name: CI

on:
  push:
    tags-ignore:
      - "v*"
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lint and formatting
        run: pnpm check

      - name: Check types
        run: pnpm typecheck

      - name: Run API and persistence tests
        run: pnpm test

      - name: Test PostgreSQL persistence and migration
        run: node tests/run-postgres.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # Playwright's webServer command builds the production app before starting it.
      - name: Build and run browser tests
        run: pnpm test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build container image
        run: docker build --tag stiva-browser:1.0.0 .

      - name: Test container security and persistence
        run: node tests/container-smoke.mjs
