name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  workflows:
    name: Validate GitHub workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install actionlint
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Validate workflow syntax and expressions
        run: '"$RUNNER_TEMP/bin/actionlint" -color'

  quality:
    name: Lint, types, and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check application and desktop versions agree
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const app = JSON.parse(readFileSync("package.json", "utf8")).version;
            const desktop = JSON.parse(readFileSync("desktop/package.json", "utf8")).version;
            if (app !== desktop) throw new Error(`Version mismatch: app ${app}, desktop ${desktop}`);
          '
      - run: pnpm audit --audit-level high
      - run: pnpm check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: node --test tests/release-latest.test.mjs tests/verified-image.test.mjs
      - run: pnpm test:desktop
      - run: python3 -m unittest discover -s scripts/tests -v

  integration:
    name: PostgreSQL and S3 integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - run: node tests/run-postgres.mjs

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build S3 fixture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: tests/s3-fixture
          load: true
          tags: stiva-s3-fixture:2025-10-15
          cache-from: type=gha,scope=s3-fixture
          cache-to: type=gha,scope=s3-fixture,mode=max

      - name: Test live S3 operations and versioning
        env:
          STIVA_TEST_S3_IMAGE: stiva-s3-fixture:2025-10-15
        run: pnpm test:s3

  browser:
    name: Browser and accessibility tests
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Playwright matches the browser image
        run: test "$(node -p 'require("@playwright/test/package.json").version')" = "1.64.1"
      - run: pnpm test:browser
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save the verified native image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TESTED_IMAGE: stiva-browser:ci
        run: |
          mkdir -p "$RUNNER_TEMP/verified-image"
          docker save "$TESTED_IMAGE" | gzip -1 > "$RUNNER_TEMP/verified-image/image.tar.gz"
          node scripts/verified-image.mjs record "$RUNNER_TEMP/verified-image" amd64 "$TESTED_IMAGE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: verified-image-amd64
          path: ${{ runner.temp }}/verified-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  container:
    name: Container and staging tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: stiva-browser:ci
          cache-from: type=gha,scope=release-amd64
          cache-to: type=gha,scope=release-amd64,mode=max
      - name: Scan container image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: stiva-browser:ci
          fail-build: true
          severity-cutoff: high
          cache-db: true
          only-fixed: false
          output-format: table
      - name: Test container security and persistence
        run: node tests/container-smoke.mjs
      - name: Build S3 fixture
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: tests/s3-fixture
          load: true
          tags: stiva-s3-fixture:2025-10-15
          cache-from: type=gha,scope=s3-fixture
          cache-to: type=gha,scope=s3-fixture,mode=max
      - name: Verify staging performance, monitoring, and rollback
        run: pnpm test:staging
      - name: Upload staging measurements
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: staging-report
          path: test-results/staging-report.json
          if-no-files-found: ignore
          retention-days: 14

  container-arm64:
    name: ARM64 container build, scan, and smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Generate image labels
        id: image-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: corvaglia91/stiva-browser
          tags: type=semver,pattern={{version}}

      - name: Build and load native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/arm64
          load: true
          labels: ${{ steps.image-meta.outputs.labels }}
          tags: |
            corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          cache-from: type=gha,scope=release-arm64
          cache-to: type=gha,mode=max,scope=release-arm64

      - name: Verify the native image is available locally
        env:
          IMAGE: corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: docker image inspect "$IMAGE" >/dev/null

      - name: Scan native release image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          fail-build: true
          severity-cutoff: high
          cache-db: true
          only-fixed: false
          output-format: table

      - name: Test native release image
        env:
          CONTAINER_IMAGE: corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-arm64
          CONTAINER_PLATFORM: linux/arm64
        run: node tests/container-smoke.mjs

      - name: Save the verified native image
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TESTED_IMAGE: corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-arm64
        run: |
          mkdir -p "$RUNNER_TEMP/verified-image"
          docker save "$TESTED_IMAGE" | gzip -1 > "$RUNNER_TEMP/verified-image/image.tar.gz"
          node scripts/verified-image.mjs record "$RUNNER_TEMP/verified-image" arm64 "$TESTED_IMAGE"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: verified-image-arm64
          path: ${{ runner.temp }}/verified-image/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  verify:
    name: Lint, test, and build
    needs: [workflows, quality, integration, browser, container, container-arm64]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          node -e 'if (!JSON.parse(process.env.RESULTS).every(result => result === "success")) process.exit(1)'
