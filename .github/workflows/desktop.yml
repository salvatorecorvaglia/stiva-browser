name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Desktop (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            executable: desktop/release/mac-arm64/Stiva Browser.app/Contents/MacOS/Stiva Browser
          - os: macos-15-intel
            arch: x64
            executable: desktop/release/mac/Stiva Browser.app/Contents/MacOS/Stiva Browser
          - os: windows-2025
            arch: x64
            executable: desktop/release/win-unpacked/Stiva Browser.exe
          - os: ubuntu-24.04
            arch: x64
            executable: desktop/release/linux-unpacked/stiva-browser
          - os: ubuntu-24.04-arm
            arch: arm64
            executable: desktop/release/linux-arm64-unpacked/stiva-browser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:prepare
      - run: pnpm test:desktop
      - run: pnpm --dir desktop audit --audit-level high
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop:smoke
      - name: Smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm test:desktop:smoke
      - name: Build installers
        if: runner.os != 'macOS'
        run: pnpm --dir desktop run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build macOS installers
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          set -o pipefail
          for attempt in 1 2 3; do
            build_log=$(mktemp)
            if pnpm --dir desktop run dist 2>&1 | tee "$build_log"; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]] || ! grep -Eq 'Unable to detach device cleanly: hdiutil:.*Resource busy' "$build_log"; then
              exit 1
            fi
            echo "::warning::DMG volume was busy; retrying installer build (attempt $((attempt + 1))/3)"
            sleep 10
          done
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop:smoke
        env:
          STIVA_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
      - name: Smoke test packaged app (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm test:desktop:smoke
        env:
          STIVA_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          compression-level: 0
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
