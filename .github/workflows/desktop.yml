name: Desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Desktop (${{ matrix.os }}, ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
            executable: desktop/release/mac-arm64/Stiva Browser.app/Contents/MacOS/Stiva Browser
          - os: macos-15-intel
            arch: x64
            executable: desktop/release/mac/Stiva Browser.app/Contents/MacOS/Stiva Browser
          - os: windows-2025
            arch: x64
            executable: desktop/release/win-unpacked/Stiva Browser.exe
          - os: ubuntu-24.04
            arch: x64
            executable: desktop/release/linux-unpacked/stiva-browser
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm desktop:prepare
      - run: pnpm test:desktop
      - run: pnpm --dir desktop install --frozen-lockfile
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop:smoke
      - name: Smoke test (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm test:desktop:smoke
      - name: Build installers
        run: pnpm --dir desktop run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm test:desktop:smoke
        env:
          STIVA_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
      - name: Smoke test packaged app (macOS and Windows)
        if: runner.os != 'Linux'
        run: pnpm test:desktop:smoke
        env:
          STIVA_DESKTOP_EXECUTABLE: ${{ matrix.executable }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: desktop-${{ runner.os }}-${{ matrix.arch }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb
          if-no-files-found: error
