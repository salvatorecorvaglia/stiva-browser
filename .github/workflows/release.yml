name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: CI
    uses: ./.github/workflows/ci.yml

  release:
    name: Publish release
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/.exec(tag);
          if (!match) throw new Error('Expected vMAJOR.MINOR.PATCH or a SemVer prerelease tag.');
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (tag !== `v${version}`) throw new Error(`Tag ${tag} must match package.json version ${version}.`);
          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\nprerelease=${Boolean(match[4])}\n`);
          NODE

      - name: Prepare release notes from changelog
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const version = process.env.RELEASE_TAG.slice(1);
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(line => line === `## [${version}]` || line.startsWith(`## [${version}] - `));
          if (start === -1) throw new Error(`CHANGELOG.md is missing a section for ${version}.`);
          const next = lines.findIndex((line, index) => index > start && /^##\s/.test(line));
          const notes = lines.slice(start + 1, next === -1 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error(`CHANGELOG.md section for ${version} is empty.`);
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          NODE

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test "$DOCKERHUB_USERNAME" = corvaglia91 || { echo "Set DOCKERHUB_USERNAME to corvaglia91."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN is required."; exit 1; }

      # The containerd store can load and push a multi-platform image index.
      - name: Set up Docker with containerd
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            { "features": { "containerd-snapshotter": true } }

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            corvaglia91/stiva-browser
            ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ steps.version.outputs.prerelease == 'false' }}

      - name: Build and load release images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Test release images on both architectures
        env:
          CONTAINER_IMAGE: corvaglia91/stiva-browser:${{ env.RELEASE_TAG }}
        run: |
          CONTAINER_PLATFORM=linux/amd64 node tests/container-smoke.mjs
          CONTAINER_PLATFORM=linux/arm64 node tests/container-smoke.mjs

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Push the locally tested indexes; do not rebuild after testing.
      - name: Publish tested images to both registries
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            docker push "$image"
          done <<< "$IMAGE_TAGS"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi
          args=(--verify-tag --title "Stiva Browser $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}"
