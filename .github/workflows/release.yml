name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release prerequisites
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.version.outputs.image }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Validate release version
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const tag = process.env.RELEASE_TAG;
          const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(-((?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9]\d*|\d*[A-Za-z-][0-9A-Za-z-]*))*))?$/.exec(tag);
          if (!match) throw new Error('Expected vMAJOR.MINOR.PATCH or a SemVer prerelease tag.');
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (tag !== `v${version}`) throw new Error(`Tag ${tag} must match package.json version ${version}.`);
          const image = `ghcr.io/${process.env.GITHUB_REPOSITORY.toLowerCase()}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `image=${image}\nprerelease=${Boolean(match[4])}\n`);
          NODE

      - name: Prepare release notes from changelog
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const version = process.env.RELEASE_TAG.slice(1);
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const start = lines.findIndex(line => line === `## [${version}]` || line.startsWith(`## [${version}] - `));
          if (start === -1) throw new Error(`CHANGELOG.md is missing a section for ${version}.`);
          const next = lines.findIndex((line, index) => index > start && /^##\s/.test(line));
          const notes = lines.slice(start + 1, next === -1 ? undefined : next).join('\n').trim();
          if (!notes) throw new Error(`CHANGELOG.md section for ${version} is empty.`);
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          NODE

      - name: Check Docker Hub credentials
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test "$DOCKERHUB_USERNAME" = corvaglia91 || { echo "Set DOCKERHUB_USERNAME to corvaglia91."; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo "DOCKERHUB_TOKEN is required."; exit 1; }

      - name: Upload release notes
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
          retention-days: 1

  verify:
    name: CI
    needs: preflight
    uses: ./.github/workflows/ci.yml

  build:
    name: Build and test (${{ matrix.arch }})
    needs: [preflight, verify]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Generate image labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: corvaglia91/stiva-browser
          tags: type=semver,pattern={{version}}

      - name: Build and load native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: |
            corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
            ${{ needs.preflight.outputs.image }}:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}

      - name: Verify the native image is available locally
        env:
          IMAGE: corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
        run: docker image inspect "$IMAGE" >/dev/null

      - name: Scan native release image
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2
        with:
          image: corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          fail-build: true
          severity-cutoff: high
          only-fixed: false
          output-format: table

      - name: Test native release image
        env:
          CONTAINER_IMAGE: corvaglia91/stiva-browser:build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          CONTAINER_PLATFORM: linux/${{ matrix.arch }}
        run: node tests/container-smoke.mjs

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Push tested images and record immutable references
        env:
          GHCR_IMAGE: ${{ needs.preflight.outputs.image }}
          BUILD_TAG: build-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          for image in corvaglia91/stiva-browser "$GHCR_IMAGE"; do
            docker push "$image:$BUILD_TAG"
            ref=$(docker image inspect "$image:$BUILD_TAG" --format '{{range .RepoDigests}}{{println .}}{{end}}' | awk -v prefix="$image@" 'index($0, prefix) == 1 { print; exit }')
            test -n "$ref"
            registry=hub
            if [[ "$image" == ghcr.io/* ]]; then registry=ghcr; fi
            echo "$ref" > "$RUNNER_TEMP/digests/$registry-$ARCH.txt"
          done

      - name: Upload tested image references
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: image-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*.txt
          retention-days: 1
          if-no-files-found: error

  desktop:
    name: Desktop installers
    needs: [preflight, verify]
    uses: ./.github/workflows/desktop.yml

  release:
    name: Publish release
    needs: [preflight, build, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Download release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Download tested image references
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: image-digests-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24

      - name: Check whether this is the highest stable tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$GH_REPO/git/matching-refs/tags/" --jq '.[].ref' > "$RUNNER_TEMP/release-tags.txt"
          node scripts/release-latest.mjs "$RUNNER_TEMP/release-tags.txt"

      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: |
            corvaglia91/stiva-browser
            ${{ needs.preflight.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.publish == 'true' }}

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publish multi-platform images to both registries
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r image; do
            registry=hub
            if [[ "$image" == ghcr.io/* ]]; then registry=ghcr; fi
            amd64=$(cat "$RUNNER_TEMP/digests/$registry-amd64.txt")
            arm64=$(cat "$RUNNER_TEMP/digests/$registry-arm64.txt")
            docker buildx imagetools create --tag "$image" "$amd64" "$arm64"
          done <<< "$IMAGE_TAGS"

      - name: Download desktop installers
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: desktop-*
          path: desktop-installers
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
          PUBLISH_LATEST: ${{ steps.latest.outputs.publish }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" desktop-installers/* --clobber
            exit 0
          fi
          args=(--verify-tag --title "Stiva Browser $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md")
          if [ "$PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          args+=(--latest="$PUBLISH_LATEST")
          gh release create "$RELEASE_TAG" "${args[@]}" desktop-installers/*
